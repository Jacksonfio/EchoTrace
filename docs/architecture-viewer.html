      margin-bottom: 6px;
      opacity: 0.8;

      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .node-desc {

      opacity: 0.8;
      line-height: 1.5;
    }
    .node-icon {
      font-size: 28px;
      margin-bottom: 8px;

      border: 2px solid #8B5CF6;
    }
    .node-backend .node-layer { color: #8B5CF6; }
    .node-ai {
      background: linear-gradient(135deg, #1a1a3e, #1e1a10);
      border: 2px solid #F59E0B;
    }
    .node-ai .node-layer { color: #F59E0B; }
    .node-storage {
      background: linear-gradient(135deg, #1a1a3e, #0f1a14);
      border: 2px solid #10B981;
    }
    .node-storage .node-layer { color: #10B981; }
    .node-default {
      background: #12122A;
      border: 1px solid #333;
    }
    .react-flow__edge-path { stroke-width: 2.5; }
    .react-flow__edge-label {
      font-size: 11px;
      fill: #94A3B8;
      background: #0A0A1A;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .react-flow__controls {
      background: #12122A;
      border: 1px solid #333;
      border-radius: 8px;
      overflow: hidden;
    }
    .react-flow__controls button {
      background: #12122A;
      border-color: #333;
      color: #fff;
      fill: #fff;
    }
    .react-flow__controls button:hover { background: #1A1A3E; }
    .react-flow__minimap {
      background: #12122A;
      border: 1px solid #333;
      border-radius: 8px;
    }
    .react-flow__attribution { display: none; }
    @media (max-width: 768px) {
      .react-flow__node { min-width: 160px; font-size: 11px; padding: 12px 14px; }

      .node-icon { font-size: 22px; }
    }
